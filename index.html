    <script>
      (function() {
        if (typeof window === 'undefined') return;
        // Suppress and handle non-critical third-party / webview miniProgram bridge errors
        window.addEventListener('error', function(event) {
          if (event && (event.message?.includes('miniProgram') || event.error?.message?.includes('miniProgram'))) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason).includes('miniProgram')) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        // Provide safe fallback objects for webview bridges (WeChat, Alipay, Baidu, etc.)
        function createSafeProxy() {
          var noop = function() {};
          return new Proxy(noop, {
            get: function(target, prop) {
              if (prop === 'getEnv') {
                return function(cb) { if (typeof cb === 'function') cb({ miniprogram: false }); };
              }
              if (typeof prop === 'symbol' || prop === 'then' || prop === 'toJSON') {
                return undefined;
              }
              return createSafeProxy();
            },
            apply: function() {
              return createSafeProxy();
            }
          });
        }
        var dummy = createSafeProxy();
        ['wx', 'my', 'swan', 'tt', 'ks'].forEach(function(key) {
          try {
            if (!window[key]) {
              window[key] = { miniProgram: dummy };
            } else if (typeof window[key] === 'object' && !window[key].miniProgram) {
              window[key].miniProgram = dummy;
            }
          } catch (e) {}
        });
      })();
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </body>
